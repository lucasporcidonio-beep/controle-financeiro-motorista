<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro - Motorista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans pb-10">
    <div class="container mx-auto p-4 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-gray-800"><i class="fas fa-car-side text-blue-600"></i> Controle Financeiro</h1>
            <div class="flex items-center bg-white p-2 rounded-lg shadow-sm">
                <label class="font-medium text-gray-700 mr-2"><i class="far fa-calendar-alt"></i> Mês/Ano:</label>
                <input type="month" id="filtro-mes" class="border-0 focus:ring-0 text-gray-700 font-semibold cursor-pointer" onchange="atualizarInterface()">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Painel de Resumo -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md h-fit space-y-6">
                <div>
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2">Resumo do Mês</h2>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">Meta Mensal (R$)</label>
                        <div class="flex mt-1">
                            <input type="number" id="meta-input" class="border p-2 rounded-l-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: 5000">
                            <button onclick="salvarMeta()" class="bg-blue-600 text-white px-4 py-2 rounded-r-md hover:bg-blue-700">Salvar</button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <p class="text-sm text-gray-500">Total Líquido Acumulado</p>
                            <p class="text-2xl font-bold text-blue-700" id="resumo-total">R$ 0,00</p>
                        </div>
                        
                        <div>
                            <p class="text-sm text-gray-500 flex justify-between">
                                <span>Progresso da Meta</span>
                                <span id="resumo-progresso-txt" class="font-bold text-gray-700">0%</span>
                            </p>
                            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-1">
                                <div class="bg-blue-600 h-2.5 rounded-full" id="resumo-barra" style="width: 0%"></div>
                            </div>
                            <p class="text-xs text-red-500 mt-1" id="resumo-falta">Faltam: R$ 0,00</p>
                        </div>

                        <div class="grid grid-cols-2 gap-4 pt-4 border-t">
                            <div>
                                <p class="text-xs text-gray-500">Média por Hora</p>
                                <p class="text-lg font-semibold text-gray-800" id="resumo-hora">R$ 0,00</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">Média por KM</p>
                                <p class="text-lg font-semibold text-gray-800" id="resumo-km">R$ 0,00</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gráfico -->
                <div class="pt-4 border-t">
                    <h3 class="text-md font-semibold text-gray-700 mb-2"><i class="fas fa-chart-bar text-blue-500"></i> Faturamento Diário (Líquido)</h3>
                    <canvas id="graficoFaturamento" width="400" height="250"></canvas>
                </div>
            </div>

            <!-- Área Principal -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Formulário de Novo Lançamento -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2" id="titulo-form">Novo Lançamento Diário</h2>
                    <form id="lancamento-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="hidden" id="edit-id" value="">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Data</label>
                            <input type="date" id="data" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Horas Trabalhadas</label>
                            <input type="number" step="0.5" id="horas" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Faturamento Bruto (R$)</label>
                            <input type="number" step="0.01" id="bruto" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Km Rodados</label>
                            <input type="number" step="1" id="km" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Consumo do Carro (Km/L)</label>
                            <input type="number" step="0.1" id="consumo" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Preço do Combustível (R$/L)</label>
                            <input type="number" step="0.01" id="preco_litro" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Manutenção/Refeição (R$)</label>
                            <input type="number" step="0.01" id="outros" required class="mt-1 border p-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="md:col-span-2 mt-2 flex gap-2">
                            <button type="submit" id="btn-submit" class="flex-1 bg-green-600 text-white font-bold py-2 px-4 rounded-md hover:bg-green-700 transition">Adicionar Dia</button>
                            <button type="button" id="btn-cancel" onclick="cancelarEdicao()" class="hidden bg-gray-500 text-white font-bold py-2 px-4 rounded-md hover:bg-gray-600 transition">Cancelar</button>
                        </div>
                    </form>
                </div>

                <!-- Tabela de Lançamentos -->
                <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2">Histórico de Lançamentos (Mês Selecionado)</h2>
                    <table class="min-w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="py-2 px-4 border-b">Data</th>
                                <th class="py-2 px-4 border-b">Horas</th>
                                <th class="py-2 px-4 border-b">KM</th>
                                <th class="py-2 px-4 border-b">Líquido (R$)</th>
                                <th class="py-2 px-4 border-b text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo">
                            <!-- JS vai popular aqui -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDxD4hm8RsTkihEL320tt5V1GH5dWyBIFE",
            authDomain: "controle-financeiro-moto-b139a.firebaseapp.com",
            projectId: "controle-financeiro-moto-b139a",
            storageBucket: "controle-financeiro-moto-b139a.firebasestorage.app",
            messagingSenderId: "711816668835",
            appId: "1:711816668835:web:b085fb4cfd0ad66c528116",
            measurementId: "G-H18F08LHVX"
        };

        // Inicializando Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let entradas = [];
        let metaMensal = 0;
        let chartInstance = null;

        // Configurar filtro de mês para o mês atual
        const hoje = new Date();
        const mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
        if(!document.getElementById('filtro-mes').value) {
            document.getElementById('filtro-mes').value = mesAtual;
        }

        const formatarMoeda = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        
        // Escutar Meta Mensal em tempo real
        db.collection("config").doc("meta").onSnapshot((doc) => {
            if (doc.exists) {
                metaMensal = doc.data().valor;
            } else {
                metaMensal = 0;
            }
            document.getElementById('meta-input').value = metaMensal > 0 ? metaMensal : '';
            atualizarInterface();
        });

        // Escutar Lançamentos em tempo real
        db.collection("lancamentos").orderBy("data").onSnapshot((snapshot) => {
            entradas = [];
            snapshot.forEach((doc) => {
                entradas.push({ id: doc.id, ...doc.data() });
            });
            atualizarInterface();
        });

        function salvarMeta() {
            const valor = parseFloat(document.getElementById('meta-input').value);
            if (!isNaN(valor) && valor > 0) {
                db.collection("config").doc("meta").set({ valor: valor })
                .then(() => alert('Meta salva com sucesso na nuvem!'))
                .catch((error) => alert('Erro ao salvar meta: ' + error));
            }
        }

        document.getElementById('lancamento-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const idEdit = document.getElementById('edit-id').value;
            
            const data = document.getElementById('data').value;
            const horas = parseFloat(document.getElementById('horas').value);
            const bruto = parseFloat(document.getElementById('bruto').value);
            const km = parseFloat(document.getElementById('km').value);
            const consumo = parseFloat(document.getElementById('consumo').value);
            const precoLitro = parseFloat(document.getElementById('preco_litro').value);
            const outros = parseFloat(document.getElementById('outros').value);

            const combustivel = (km / consumo) * precoLitro;
            const liquido = bruto - combustivel - outros;

            const lancamentoData = { data, horas, bruto, km, consumo, precoLitro, combustivel, outros, liquido };

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = "Salvando...";
            btnSubmit.disabled = true;

            if (idEdit) {
                // Modo edição
                db.collection("lancamentos").doc(idEdit).update(lancamentoData).then(() => {
                    cancelarEdicao();
                }).finally(() => {
                    btnSubmit.disabled = false;
                });
            } else {
                // Novo registro
                db.collection("lancamentos").add(lancamentoData).then(() => {
                    const mesEntrada = data.substring(0, 7);
                    document.getElementById('filtro-mes').value = mesEntrada;
                    this.reset();
                }).finally(() => {
                    btnSubmit.innerText = "Adicionar Dia";
                    btnSubmit.disabled = false;
                });
            }
        });

        function deletarEntrada(id) {
            if(confirm("Tem certeza que deseja excluir este dia?")) {
                db.collection("lancamentos").doc(id).delete();
            }
        }

        function editarEntrada(id) {
            const entrada = entradas.find(e => e.id === id);
            if(!entrada) return;

            document.getElementById('edit-id').value = entrada.id;
            document.getElementById('data').value = entrada.data;
            document.getElementById('horas').value = entrada.horas;
            document.getElementById('bruto').value = entrada.bruto;
            document.getElementById('km').value = entrada.km;
            document.getElementById('consumo').value = entrada.consumo || '';
            document.getElementById('preco_litro').value = entrada.precoLitro || '';
            document.getElementById('outros').value = entrada.outros;

            document.getElementById('titulo-form').innerText = "Editar Lançamento";
            document.getElementById('titulo-form').className = "text-xl font-semibold mb-4 border-b pb-2 text-blue-600";
            
            document.getElementById('btn-submit').innerText = "Salvar Alterações";
            document.getElementById('btn-submit').className = "flex-1 bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition";
            document.getElementById('btn-cancel').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            document.getElementById('edit-id').value = '';
            document.getElementById('lancamento-form').reset();
            
            document.getElementById('titulo-form').innerText = "Novo Lançamento Diário";
            document.getElementById('titulo-form').className = "text-xl font-semibold mb-4 border-b pb-2";
            
            document.getElementById('btn-submit').innerText = "Adicionar Dia";
            document.getElementById('btn-submit').className = "flex-1 bg-green-600 text-white font-bold py-2 px-4 rounded-md hover:bg-green-700 transition";
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        function atualizarInterface() {
            const mesSelecionado = document.getElementById('filtro-mes').value;
            
            const entradasFiltradas = entradas.filter(e => e.data.startsWith(mesSelecionado));

            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';
            
            let totalLiquido = 0;
            let totalHoras = 0;
            let totalKm = 0;

            const diasGrafico = [];
            const liquidoGrafico = [];

            entradasFiltradas.forEach(e => {
                totalLiquido += e.liquido;
                totalHoras += e.horas;
                totalKm += e.km;

                const [ano, mes, dia] = e.data.split('-');
                const dataFormatada = `${dia}/${mes}/${ano}`;
                
                diasGrafico.push(dia);
                liquidoGrafico.push(e.liquido);

                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 border-b";
                row.innerHTML = `
                    <td class="py-2 px-4">${dataFormatada}</td>
                    <td class="py-2 px-4">${e.horas}h</td>
                    <td class="py-2 px-4">${e.km}</td>
                    <td class="py-2 px-4 font-semibold ${e.liquido >= 0 ? 'text-green-600' : 'text-red-600'}">${formatarMoeda(e.liquido)}</td>
                    <td class="py-2 px-4 text-center space-x-2">
                        <button onclick="editarEntrada('${e.id}')" class="text-blue-500 hover:text-blue-700 transition" title="Editar"><i class="fas fa-edit"></i></button>
                        <button onclick="deletarEntrada('${e.id}')" class="text-red-500 hover:text-red-700 transition" title="Excluir"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            if (entradasFiltradas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-500">Nenhum lançamento encontrado neste mês.</td></tr>`;
            }

            document.getElementById('resumo-total').innerText = formatarMoeda(totalLiquido);
            
            const mediaHora = totalHoras > 0 ? totalLiquido / totalHoras : 0;
            const mediaKm = totalKm > 0 ? totalLiquido / totalKm : 0;
            
            document.getElementById('resumo-hora').innerText = formatarMoeda(mediaHora);
            document.getElementById('resumo-km').innerText = formatarMoeda(mediaKm);

            if (metaMensal > 0) {
                let progresso = (totalLiquido / metaMensal) * 100;
                let falta = metaMensal - totalLiquido;
                
                if (progresso < 0) progresso = 0;
                
                document.getElementById('resumo-progresso-txt').innerText = `${progresso.toFixed(1)}%`;
                document.getElementById('resumo-barra').style.width = `${Math.min(progresso, 100)}%`;
                
                if (falta > 0) {
                    document.getElementById('resumo-falta').innerText = `Faltam: ${formatarMoeda(falta)}`;
                    document.getElementById('resumo-falta').className = "text-xs text-red-500 mt-1";
                } else {
                    document.getElementById('resumo-falta').innerText = "Meta Atingida! 🎉";
                    document.getElementById('resumo-falta').className = "text-xs text-green-600 font-bold mt-1";
                }
            } else {
                document.getElementById('resumo-progresso-txt').innerText = "0%";
                document.getElementById('resumo-barra').style.width = "0%";
                document.getElementById('resumo-falta').innerText = "Defina uma meta acima";
                document.getElementById('resumo-falta').className = "text-xs text-gray-500 mt-1";
            }

            atualizarGrafico(diasGrafico, liquidoGrafico);
        }

        function atualizarGrafico(labels, data) {
            const ctx = document.getElementById('graficoFaturamento').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Faturamento Líquido (R$)',
                        data: data,
                        backgroundColor: data.map(v => v >= 0 ? 'rgba(37, 99, 235, 0.7)' : 'rgba(220, 38, 38, 0.7)'),
                        borderColor: data.map(v => v >= 0 ? 'rgb(37, 99, 235)' : 'rgb(220, 38, 38)'),
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
